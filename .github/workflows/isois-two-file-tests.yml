name: IS⊙IS two-file regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r code/FIELDS/external_libraries_requirements.txt
      - name: Compile the two IS⊙IS Python files
        run: |
          python -m py_compile code/IS⊙IS/isois_reader.py code/IS⊙IS/isois_analyzer.py
      - name: Run instrument and integrated compatibility tests
        run: python project.py test
