name: Python self-tests

on:
  push:
    paths:
      - "code/**"
      - ".github/workflows/python-self-tests.yml"
  pull_request:
    paths:
      - "code/**"
      - ".github/workflows/python-self-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Readers and analysis self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/FIELDS/external_libraries_requirements.txt
      - name: Install dependencies
        run: python -m pip install -r code/FIELDS/external_libraries_requirements.txt
      - name: Verify all Python files compile
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          scripts = sorted(Path("code").rglob("*.py"))
          assert scripts
          for script in scripts:
              ast.parse(script.read_text(encoding="utf-8"), filename=str(script))
              print("SYNTAX OK:", script)
          PY
      - name: FIELDS reader
        run: python code/FIELDS/magnetic_data_reader.py --self-test
      - name: FIELDS analysis
        run: python code/FIELDS/magnetic_data_analysis.py --self-test
      - name: IS⊙IS summary reader
        run: python 'code/IS⊙IS/particle_data_reader.py' --self-test
      - name: IS⊙IS survey analysis
        run: python 'code/IS⊙IS/particle_data_analysis.py' --self-test
      - name: IS⊙IS native-cadence reader
        run: python 'code/IS⊙IS/particle_highres_reader.py' --self-test
      - name: IS⊙IS fine coverage
        run: python 'code/IS⊙IS/particle_coverage_audit.py' --self-test
      - name: IS⊙IS multiresolution
        run: python 'code/IS⊙IS/particle_multires_coverage.py' --self-test
      - name: SWEAP reader
        run: python code/SWEAP/sweap_data_reader.py --self-test
