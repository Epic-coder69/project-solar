name: Project Solar self-tests

on:
  push:
    paths:
      - "code/**"
      - "project.py"
      - "cleanup_local.py"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "code/**"
      - "project.py"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: All instrument self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/FIELDS/external_libraries_requirements.txt
      - name: Install dependencies
        run: python -m pip install -r code/FIELDS/external_libraries_requirements.txt
      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = sorted(Path(".").glob("*.py")) + sorted(Path("code").rglob("*.py"))
          assert paths
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print("SYNTAX OK", path)
          PY
      - name: Test duplicate and log cleanup without real data
        run: python project.py cleanup --self-test
      - name: Test unified CLI and every instrument
        run: |
          python project.py status
          python project.py test
