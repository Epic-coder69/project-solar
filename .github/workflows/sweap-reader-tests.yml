name: SWEAP unified reader smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'code/SWEAP/sweap_data_reader.py'
      - '.github/workflows/sweap-reader-tests.yml'
      - 'project.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reader-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: code/FIELDS/external_libraries_requirements.txt
      - name: Install dependencies
        run: python -m pip install -r code/FIELDS/external_libraries_requirements.txt
      - name: Compile single-file SWEAP reader
        run: python -m py_compile code/SWEAP/sweap_data_reader.py
      - name: Test merged reader and survey functions
        run: python project.py sweap --self-test
      - name: Ensure all 13 NASA products are listed
        run: |
          python project.py sweap --list-products | tee /tmp/sweap-products.txt
          test "$(wc -l < /tmp/sweap-products.txt)" -eq 13
      - name: Check CLI
        run: python project.py sweap --help
